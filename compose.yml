services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: exmatch
      POSTGRES_USER: exmatch
      POSTGRES_PASSWORD: exmatch
    ports:
      - "5432:5432"
    volumes:
      - exmatch_db_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1125:1025"

volumes:
  exmatch_db_data: